<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Léonie 💖 Ma Valentine ?</title>
<style>
    body {
        font-family: 'Comic Sans MS', cursive, sans-serif;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        min-height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        overflow: hidden;
        padding: 15px;
    }
    .card {
        background: white;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        max-width: 100%;
        width: 100%;
        max-width: 420px;
        animation: pop 0.8s ease;
    }
    @keyframes pop {
        0% { transform: scale(0.85); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    h1 {
        color: #ff3366;
        font-size: 26px;
    }
    p {
        font-size: 18px;
    }
    #countdown {
        font-weight: bold;
        margin: 12px 0;
        color: #ff3366;
        font-size: 16px;
    }
    .buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 15px;
    }
    button {
        padding: 14px;
        font-size: 18px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        width: 100%;
    }
    #yes {
        background: #ff3366;
        color: white;
    }
    #no {
        background: #ddd;
        position: relative;
    }
</style>
</head>
<body>

<div class="card">
    <h1>Léonie 💘</h1>
    <p>Est-ce que tu veux être <b>ma Valentine</b> ? 😏</p>
    <div id="countdown"></div>
    <div class="buttons">
        <button id="yes">OUIII ❤️</button>
        <button id="no">Hmm… non 😬</button>
    </div>
</div>

<script>
    const noBtn = document.getElementById("no");

    noBtn.addEventListener("touchstart", moveNo);
    noBtn.addEventListener("mouseover", moveNo);

    function moveNo() {
        const x = Math.random() * (window.innerWidth - 140);
        const y = Math.random() * (window.innerHeight - 80);
        noBtn.style.position = "fixed";
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }

    document.getElementById("yes").addEventListener("click", () => {
        document.body.innerHTML = `
            <div style="text-align:center;color:white;padding:20px;">
                <h1 style="font-size:34px;">YEEEES LÉONIE 😍💖</h1>
                <p style="font-size:20px;">Officiellement ma Valentine 💌</p>
                <p>Rendez-vous le 14 février 🥰</p>
            </div>
        `;
    });

    function updateCountdown() {
        const now = new Date();
        const valentinesDay = new Date(now.getFullYear(), 1, 14);
        if (now > valentinesDay) valentinesDay.setFullYear(valentinesDay.getFullYear() + 1);
        const diff = valentinesDay - now;

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);

        document.getElementById("countdown").innerHTML =
            `⏳ Saint-Valentin dans ${days}j ${hours}h ${minutes}min 💞`;
    }

    updateCountdown();
    setInterval(updateCountdown, 60000);
</script>

</body>
</html>
